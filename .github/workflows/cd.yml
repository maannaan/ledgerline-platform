name: cd

# Manual parameterized CD. No GitHub Actions secrets — OIDC + AWS Secrets Manager.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      image_tag:
        description: ECR image tag (empty on deploy = short git SHA; required for rollback)
        required: false
        type: string
        default: ""
      confirm_production:
        description: Type DEPLOY to allow production deploy/rollback
        required: false
        type: string
        default: ""
      run_tests:
        description: Run pytest isolation suite
        type: boolean
        default: true
      run_sonar:
        description: Run SonarCloud (token from ASM)
        type: boolean
        default: false
      run_security_scan:
        description: Run pip-audit + Trivy
        type: boolean
        default: true
      run_terraform_validate:
        description: Run terraform fmt + validate
        type: boolean
        default: false
      run_build_push:
        description: Build and push image tagged for deploy
        type: boolean
        default: false
      run_deploy:
        description: Deploy ECS to image_tag digest
        type: boolean
        default: false
      run_rollback:
        description: Rollback ECS to existing image_tag (no rebuild)
        type: boolean
        default: false

env:
  AWS_REGION: ap-south-1

jobs:
  guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      role_arn: ${{ steps.cfg.outputs.role_arn }}
      ci_secret_name: ${{ steps.cfg.outputs.ci_secret_name }}
      environment: ${{ steps.cfg.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate inputs
        env:
          IN_IMAGE_TAG: ${{ inputs.image_tag }}
          IN_CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          IN_ENVIRONMENT: ${{ inputs.environment }}
          IN_RUN_DEPLOY: ${{ inputs.run_deploy }}
          IN_RUN_ROLLBACK: ${{ inputs.run_rollback }}
        run: |
          set -euo pipefail
          if [[ "$IN_RUN_DEPLOY" == "true" && "$IN_RUN_ROLLBACK" == "true" ]]; then
            echo "Refuse: run_deploy and run_rollback are mutually exclusive"
            exit 1
          fi
          if [[ "$IN_RUN_ROLLBACK" == "true" && -z "$IN_IMAGE_TAG" ]]; then
            echo "Refuse: rollback requires image_tag"
            exit 1
          fi
          if [[ "$IN_ENVIRONMENT" == "production" && ( "$IN_RUN_DEPLOY" == "true" || "$IN_RUN_ROLLBACK" == "true" ) && "$IN_CONFIRM_PRODUCTION" != "DEPLOY" ]]; then
            echo "Refuse: production deploy/rollback requires confirm_production=DEPLOY"
            exit 1
          fi

      - name: Resolve image tag
        id: tag
        env:
          IN_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$IN_IMAGE_TAG" ]]; then
            echo "image_tag=${IN_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Load role config
        id: cfg
        env:
          IN_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$IN_ENVIRONMENT" in
            staging|production) ;;
            *) echo "invalid environment"; exit 1 ;;
          esac
          ROLE=$(python3 -c "import json,os; print(json.load(open('.github/workflows/aws-role-arns.json'))[os.environ['IN_ENVIRONMENT']]['role_arn'])")
          SECRET=$(python3 -c "import json,os; print(json.load(open('.github/workflows/aws-role-arns.json'))[os.environ['IN_ENVIRONMENT']]['ci_secret_name'])")
          echo "role_arn=${ROLE}" >> "$GITHUB_OUTPUT"
          echo "ci_secret_name=${SECRET}" >> "$GITHUB_OUTPUT"
          echo "environment=${IN_ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  tests:
    needs: guards
    if: inputs.run_tests == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci_ephemeral_db_only
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://admin:ci_ephemeral_db_only@localhost:5432/ledgerline
      ADMIN_TOKEN: ci-admin-token-not-for-prod
      API_KEY_PEPPER: ci-pepper-not-for-prod
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - run: pip install "--only-binary=:all:" -r requirements-dev.txt
      - run: python -m pytest

  sonar:
    needs: guards
    if: inputs.run_sonar == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ needs.guards.outputs.role_arn }}
          aws-region: ap-south-1
      - name: Fetch CI secret
        env:
          CI_SECRET_NAME: ${{ needs.guards.outputs.ci_secret_name }}
        run: |
          chmod +x .github/scripts/fetch-ci-secret.sh
          .github/scripts/fetch-ci-secret.sh "$CI_SECRET_NAME"
      - name: Require Sonar token
        env:
          CI_SECRET_NAME: ${{ needs.guards.outputs.ci_secret_name }}
        run: |
          if [[ "${SONAR_READY}" != "true" ]]; then
            echo "SONAR_TOKEN not set in ASM ${CI_SECRET_NAME}"
            exit 1
          fi
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .

  security_scan:
    needs: guards
    if: inputs.run_security_scan == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install "--only-binary=:all:" pip-audit==2.7.3
          pip-audit -r requirements.txt --progress-spinner off
      - name: Build image for Trivy
        working-directory: .
        run: docker build -t ledgerline-api:cd ./app
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ledgerline-api:cd
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

  terraform_validate:
    needs: guards
    if: inputs.run_terraform_validate == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/environments/${{ needs.guards.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false
          terraform validate

  build_push:
    needs: [guards, tests, security_scan]
    if: |
      always() &&
      inputs.run_build_push == true &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
      (needs.security_scan.result == 'success' || needs.security_scan.result == 'skipped') &&
      needs.guards.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ needs.guards.outputs.role_arn }}
          aws-region: ap-south-1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push
        env:
          IMAGE_TAG: ${{ needs.guards.outputs.image_tag }}
          ENV_NAME: ${{ needs.guards.outputs.environment }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          PREFIX="ll-${ENV_NAME}"
          ECR_REPO="${PREFIX}-api"
          ECR="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker build --platform linux/amd64 -t "${ECR}:${IMAGE_TAG}" -t "${ECR}:latest" ./app
          docker push "${ECR}:${IMAGE_TAG}"
          docker push "${ECR}:latest"
          echo "Pushed ${ECR}:${IMAGE_TAG}"

  deploy:
    needs: [guards, build_push, tests, security_scan, sonar, terraform_validate]
    if: |
      always() &&
      inputs.run_deploy == true &&
      needs.guards.result == 'success' &&
      (needs.build_push.result == 'success' || (needs.build_push.result == 'skipped' && inputs.run_build_push == false)) &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
      (needs.security_scan.result == 'success' || needs.security_scan.result == 'skipped') &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (needs.terraform_validate.result == 'success' || needs.terraform_validate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ needs.guards.outputs.role_arn }}
          aws-region: ap-south-1
      - name: Deploy by tag
        env:
          IMAGE_TAG: ${{ needs.guards.outputs.image_tag }}
          ENV_NAME: ${{ needs.guards.outputs.environment }}
        run: |
          chmod +x infra/scripts/deploy_env.sh
          ./infra/scripts/deploy_env.sh "$ENV_NAME" "$IMAGE_TAG" --skip-build
      - name: Smoke /ready
        env:
          CI_SECRET_NAME: ${{ needs.guards.outputs.ci_secret_name }}
        run: |
          chmod +x .github/scripts/fetch-ci-secret.sh
          .github/scripts/fetch-ci-secret.sh "$CI_SECRET_NAME"
          if [[ -n "${ALB_SMOKE_URL:-}" ]]; then
            curl -sfS --retry 10 --retry-delay 5 "${ALB_SMOKE_URL}/ready"
            echo
          else
            echo "ALB_SMOKE_URL empty in ASM; skip smoke"
          fi

  rollback:
    needs: guards
    if: inputs.run_rollback == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ needs.guards.outputs.role_arn }}
          aws-region: ap-south-1
      - name: Rollback by tag
        env:
          IMAGE_TAG: ${{ needs.guards.outputs.image_tag }}
          ENV_NAME: ${{ needs.guards.outputs.environment }}
        run: |
          chmod +x infra/scripts/rollback_env.sh
          ./infra/scripts/rollback_env.sh "$ENV_NAME" "$IMAGE_TAG"
      - name: Smoke /ready
        env:
          CI_SECRET_NAME: ${{ needs.guards.outputs.ci_secret_name }}
        run: |
          chmod +x .github/scripts/fetch-ci-secret.sh
          .github/scripts/fetch-ci-secret.sh "$CI_SECRET_NAME"
          if [[ -n "${ALB_SMOKE_URL:-}" ]]; then
            curl -sfS --retry 10 --retry-delay 5 "${ALB_SMOKE_URL}/ready"
            echo
          else
            echo "ALB_SMOKE_URL empty in ASM; skip smoke"
          fi
