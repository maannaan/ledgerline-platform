name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# No GitHub Actions secrets. AWS via OIDC; Sonar token from Secrets Manager.
permissions:
  id-token: write
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://admin:admin123@localhost:5432/ledgerline
      ADMIN_TOKEN: ci-admin-token-not-for-prod
      API_KEY_PEPPER: ci-pepper-not-for-prod
      AWS_REGION: ap-south-1

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve staging OIDC role
        id: role
        working-directory: .
        run: |
          ROLE=$(python3 -c 'import json; print(json.load(open(".github/workflows/aws-role-arns.json"))["staging"]["role_arn"])')
          SECRET=$(python3 -c 'import json; print(json.load(open(".github/workflows/aws-role-arns.json"))["staging"]["ci_secret_name"])')
          echo "role_arn=${ROLE}" >> "$GITHUB_OUTPUT"
          echo "ci_secret_name=${SECRET}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        id: aws
        with:
          role-to-assume: ${{ steps.role.outputs.role_arn }}
          aws-region: ap-south-1

      - name: Fetch CI secret from Secrets Manager
        if: steps.aws.outcome == 'success'
        working-directory: .
        run: |
          chmod +x .github/scripts/fetch-ci-secret.sh
          .github/scripts/fetch-ci-secret.sh "${{ steps.role.outputs.ci_secret_name }}"

      - name: Mark Sonar unavailable when OIDC not applied yet
        if: steps.aws.outcome != 'success'
        run: echo "SONAR_READY=false" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --progress-spinner off

      - name: Tenant isolation + unit tests
        run: python -m pytest

      - name: SonarCloud scan
        if: env.SONAR_READY == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: .

      - name: Build container image
        working-directory: .
        run: docker build -t ledgerline-api:ci ./app

      - name: Container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ledgerline-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform fmt + validate
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false
          terraform validate
