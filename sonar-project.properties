# SonarCloud — token lives in AWS Secrets Manager ll-{env}/ci (SONAR_TOKEN).
sonar.projectKey=maannaan_ledgerline-platform
sonar.organization=croodycoder
sonar.projectName=ledgerline-platform
sonar.sources=app,.github,infra,autopilot,docker-compose.yml
sonar.tests=app/tests
sonar.exclusions=**/__pycache__/**,**/venv/**,**/.venv/**,**/node_modules/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Lab-only ephemeral DB passwords in CI/compose (not production credentials).
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e1.resourceKey=**/.github/workflows/**
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e2.resourceKey=**/docker-compose.yml
sonar.issue.ignore.multicriteria.e3.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.e3.resourceKey=**/infra/modules/ecs_api/**
