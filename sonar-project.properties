# SonarCloud Automatic Analysis (GitHub app).
sonar.projectKey=maannaan_ledgerline-platform
sonar.organization=croodycoder
sonar.projectName=ledgerline-platform

sonar.sources=app,autopilot,infra
sonar.tests=app/tests

# AutoScan indexes many file types unless excluded.
sonar.exclusions=\
  **/.github/**,\
  **/Dockerfile,\
  **/docker-compose.yml,\
  **/ci_install_deps.sh,\
  **/ci_pip_audit.sh,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/venv/**,\
  **/.terraform/**,\
  **/*.tfstate*,\
  **/tfplan

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
