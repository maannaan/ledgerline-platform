# SonarCloud Automatic Analysis (GitHub app).
# Token for optional manual CD scan: ASM ll-{env}/ci (SONAR_TOKEN).
sonar.projectKey=maannaan_ledgerline-platform
sonar.organization=croodycoder
sonar.projectName=ledgerline-platform

# Analyze product code only — not GHA workflows / compose lab fixtures.
sonar.sources=app,autopilot,infra
sonar.tests=app/tests
sonar.exclusions=**/__pycache__/**,**/venv/**,**/.venv/**,**/node_modules/**,**/.terraform/**,**/tfplan,**/*.tfstate*

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Lean staging: ALB access_logs intentionally omitted (cost); enable with S3 later.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.e1.resourceKey=**/infra/modules/ecs_api/**
