services:
  api:
    build: ./app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Requires DATABASE_URL in .env (see .env.example). No inline DB credentials.
      ENVIRONMENT: local
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerline}
      # Set POSTGRES_PASSWORD in .env — no default credential in compose.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
